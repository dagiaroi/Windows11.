
name: Cloud PC - Tailscale Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest $url -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TS_AUTHKEY) {
            throw "Missing TAILSCALE_AUTHKEY repository secret."
          }

          & $exe up "--authkey=$env:TS_AUTHKEY" `
            "--hostname=github-cloud-pc"

          Start-Sleep -Seconds 5

          $ip = & $exe ip -4
          if (-not $ip) {
            throw "Tailscale IP was not assigned."
          }

          Write-Host "Tailscale connection established."
          Write-Host "Runner Tailscale IP: $ip"

      - name: Verify Tailscale
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status
          Write-Host "Tailscale test completed."
          
